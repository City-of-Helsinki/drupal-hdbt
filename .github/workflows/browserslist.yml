name: Update browserslist db

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 1 * *'  # Run on the first day of each month at 12

permissions:
  contents: write
  pull-requests: write

jobs:
  update_browserslist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Update browserslist db
        run: npx --yes update-browserslist-db@1

        # The caniuse-lite data drives autoprefixer, so the committed dist
        # files must be rebuilt whenever the data changes.
      - name: Rebuild the theme
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Updated browserslist db
          title: Automatic browserslist db update
          labels: auto-update
          body: |
            # Browserslist db update

            The `caniuse-lite` data was refreshed and the theme rebuilt.

            ## How to test

            * [ ] Check that the `package-lock.json` diff only touches `caniuse-lite`
            * [ ] Check that the changes for distributed files are sensible
          branch: automation/browserslist-db
