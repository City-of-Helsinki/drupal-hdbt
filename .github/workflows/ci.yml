on:
  pull_request:
  push:
    branches:
      - main
name: CI

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.4']
    container:
      image: ghcr.io/city-of-helsinki/drupal-docker-base:${{ matrix.php-versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set variables
        run: echo "DRUPAL_ROOT=$HOME/drupal" >> $GITHUB_ENV

      - name: Parse $THEME_NAME from composer.json
        run: echo "THEME_NAME=$(cat composer.json | jq -r .name | awk -F/ '{print $NF}')" >> $GITHUB_ENV

      - name: Clone platform
        run: git clone https://github.com/City-of-Helsinki/drupal-helfi-platform.git $DRUPAL_ROOT

      - name: Build project
        run: |
          cd $DRUPAL_ROOT
          composer config repositories.5 path $GITHUB_WORKSPACE
          composer require drupal/$THEME_NAME -W

      - name: Check that theme is not built with dev mode
        run: if grep -q 'sourceMappingURL=' -R public/themes/contrib/$THEME_NAME/dist/css; then exit 1; fi

      - name: Run PHPCS
        run: |
          cd $DRUPAL_ROOT
          vendor/bin/phpcs public/themes/contrib/$THEME_NAME --extensions=php,theme,module --standard=Drupal,DrupalPractice

      - name: Run phpstan
        working-directory: ${{ env.DRUPAL_ROOT }}
        run: vendor/bin/phpstan analyze -c public/themes/contrib/$THEME_NAME/phpstan.neon public/themes/contrib/$THEME_NAME


  test-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/themes/contrib/hdbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The theme builder resolves node_modules through '../../contrib/hdbt'.
          path: public/themes/contrib/hdbt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'public/themes/contrib/hdbt/.nvmrc'

      - name: Install the npm version required by package.json
        run: npm install -g npm@latest

      - name: Run tests
        run: |
          npm ci
          npm run lint

      - name: Run unit tests
        run: npm run coverage

      - name: NPM Audit
        run: npm audit --audit-level high

      - name: Check that the build produced no changes
        run: |
          npm ci
          npm run build
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build output is out of date. Run 'npm run build' and commit the result."
            git status --porcelain
            git diff --stat
            exit 1
          fi
