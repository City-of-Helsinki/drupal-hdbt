name: Npm audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 0'  # Run every Sunday at 12

permissions:
  contents: write
  pull-requests: write

jobs:
  npm_audit:
    uses: city-of-helsinki/drupal-gh-actions/.github/workflows/npm-audit.yml@main
    with:
      paths: '.'
      fetch_hdbt: false
